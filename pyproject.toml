[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcode"
dynamic = ["version"]
description = "A Claude-Code-style terminal coding agent for a self-hosted Qwen2.5-Coder (Ollama)"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40",
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
    "typer>=0.12",
    "httpx>=0.25",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qcode = "qcode.cli:app"

[project.urls]
Homepage = "https://github.com/tokenthing/qcode"

[tool.setuptools.dynamic]
version = {attr = "qcode.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
