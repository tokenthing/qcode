name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Check the tag matches qcode.__version__
        run: |
          version=$(python -c "import qcode; print(qcode.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match qcode.__version__ ($version)"; exit 1
          fi
      - run: python scripts/build_installer.py --generic
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/install_qcode.py --title "qcode $GITHUB_REF_NAME" --generate-notes
